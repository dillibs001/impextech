version: '3.8'

services:
  # 1. PostgreSQL Database for Vendure
  postgres:
    image: postgres:15-alpine
    container_name: impextech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: impextech
      POSTGRES_PASSWORD: ImpexTechSecurePassword123!
      POSTGRES_DB: vendure
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impextech -d vendure"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Vendure Backend API & Worker
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: impextech-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_SYNCHRONIZE=true
      - DATABASE_URL=postgres://${POSTGRES_USER:-impextech}:${POSTGRES_PASSWORD:-ImpexTechSecurePassword123!}@postgres:5432/${POSTGRES_DB:-vendure}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - SUPERADMIN_USERNAME=${SUPERADMIN_USERNAME:-superadmin}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - SMTP_HOST=${SMTP_HOST:-smtp.resend.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-resend}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM:-"impextech" <onboarding@resend.dev>}
    volumes:
      - vendure_assets:/app/apps/api/static/assets
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Next.js Web Storefront
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: impextech-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INTERNAL_API_URL=http://api:3001/shop-api
      - NEXT_PUBLIC_API_URL=http://localhost:3001/shop-api
      - NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY=${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  vendure_assets:
