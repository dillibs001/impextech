packages:
  - "apps/*"
# Packages allowed to run install scripts (native builds). A list, so both
# pnpm 9 and pnpm/action-setup's installer can read it.
onlyBuiltDependencies:
  - '@apollo/protobufjs'
  - '@google/genai'
  - '@nestjs/core'
  - bcrypt
  - better-sqlite3
  - protobufjs
  - sharp
  - sqlite3
  - unrs-resolver
